<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>Pagebound</title>
    <meta name="description" content="A private, tactile journaling scrapbook. Your pages stay on your device." />
    <meta name="theme-color" content="#FAF6EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1814" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pagebound" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="style" href="/fonts/fonts.css" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/caveat-latin-400.woff2" crossorigin />
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong one. Mirrors resolveTheme() in src/store/settings.ts.
      (function () {
        try {
          var raw = localStorage.getItem('pagebound.theme') || 'system';
          var dark = raw === 'dark' || (raw === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) { /* private mode: fall back to the light default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; max-width: 34rem; margin: 0 auto">
        Pagebound is a drawing and writing tool, so it needs JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
